<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#4CAF50"/>
  
  <!-- Leaf 1 -->
  <path d="M 96 30 Q 110 50 105 75 Q 100 60 85 55 Z" fill="#45a049" opacity="0.9"/>
  
  <!-- Leaf 2 -->
  <path d="M 96 30 Q 82 50 87 75 Q 92 60 107 55 Z" fill="#2e7d32" opacity="0.85"/>
  
  <!-- Center circle representing plant/crop -->
  <circle cx="96" cy="110" r="25" fill="#8BC34A"/>
  
  <!-- Growth rings -->
  <circle cx="96" cy="110" r="20" fill="none" stroke="#7CB342" stroke-width="2" opacity="0.7"/>
  <circle cx="96" cy="110" r="15" fill="none" stroke="#7CB342" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Stem lines -->
  <line x1="96" y1="85" x2="96" y2="110" stroke="#558B2F" stroke-width="3"/>
  
  <!-- Small leaf accents -->
  <path d="M 85 95 L 80 90 L 82 95 Z" fill="#558B2F"/>
  <path d="M 107 95 L 112 90 L 110 95 Z" fill="#558B2F"/>
  
  <!-- Highlight for depth -->
  <ellipse cx="85" cy="100" rx="8" ry="12" fill="#ffffff" opacity="0.15"/>
</svg>
